apiVersion: v1
kind: ServiceAccount
metadata: {name: incident-agent, namespace: bookinfo-develop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: incident-reader, namespace: bookinfo-develop}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: incident-reader, namespace: bookinfo-develop}
subjects: [{kind: ServiceAccount, name: incident-agent, namespace: bookinfo-develop}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: incident-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: bookinfo-status-reader, namespace: argocd}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [bookinfo-develop]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: bookinfo-status-reader, namespace: argocd}
subjects: [{kind: ServiceAccount, name: incident-agent, namespace: bookinfo-develop}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: bookinfo-status-reader}
