apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews-split
  namespace: bookinfo-develop
spec:
  parentRefs: [{group: '', kind: Service, name: reviews, port: 9080}]
  rules:
    - backendRefs:
        - {name: reviews-v1, port: 9080, weight: 90}
        - {name: reviews-v2, port: 9080, weight: 10}
---
apiVersion: v1
kind: Service
metadata: {name: reviews-v1, namespace: bookinfo-develop}
spec:
  selector: {app: reviews, version: v1}
  ports: [{name: http, port: 9080}]
---
apiVersion: v1
kind: Service
metadata: {name: reviews-v2, namespace: bookinfo-develop}
spec:
  selector: {app: reviews, version: v2}
  ports: [{name: http, port: 9080}]
