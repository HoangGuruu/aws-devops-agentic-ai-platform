apiVersion: v1
kind: ConfigMap
metadata: {name: mysql-init, namespace: bookinfo-develop}
data:
  init.sql: |
    USE test;
    CREATE TABLE IF NOT EXISTS ratings (ReviewID INT PRIMARY KEY, Rating INT);
    INSERT INTO ratings VALUES (1, 3), (2, 4);
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: bookinfo-develop}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql, namespace: bookinfo-develop}
spec:
  serviceName: mysql
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata:
      labels: {app: mysql}
      annotations: {sidecar.istio.io/inject: 'false'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - {name: MYSQL_DATABASE, value: test}
            - {name: MYSQL_USER, value: ratings}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: root-password}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: password}}
          ports: [{containerPort: 3306}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe: {tcpSocket: {port: 3306}, initialDelaySeconds: 20}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes: [{name: init, configMap: {name: mysql-init}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: course-gp3
        resources: {requests: {storage: 2Gi}}
