# Isolated lab DB: no authentication, ClusterIP only. Use Atlas + Vault for managed database lab.
apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: bookinfo-develop}
spec:
  selector: {app: mongodb}
  ports: [{name: mongo, port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongodb, namespace: bookinfo-develop}
spec:
  serviceName: mongodb
  replicas: 1
  selector: {matchLabels: {app: mongodb}}
  template:
    metadata:
      labels: {app: mongodb}
      annotations: {sidecar.istio.io/inject: 'false'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongodb
          image: mongo:8.0.8
          ports: [{containerPort: 27017}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data/db}]
          readinessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 10}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: course-gp3
        resources: {requests: {storage: 2Gi}}
