apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bookinfo
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [bookinfo-develop]
  selector:
    matchLabels: {app: productpage}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookinfo-incidents
  namespace: monitoring
spec:
  groups:
    - name: bookinfo
      rules:
        - alert: BookinfoHighErrorRate
          expr: sum(rate(bookinfo_http_responses_total{namespace="bookinfo-develop",path="/productpage",status=~"5.."}[2m])) / clamp_min(sum(rate(bookinfo_http_responses_total{namespace="bookinfo-develop",path="/productpage"}[2m])), 0.001) > 0.2
          for: 1m
          labels: {severity: warning, course: bookinfo}
          annotations:
            summary: Productpage HTTP error ratio above 20 percent
            runbook: docs/runbooks/http500.md
        - alert: BookinfoUnavailable
          expr: kube_deployment_status_replicas_available{namespace="bookinfo-develop",deployment="productpage-v1"} < 1
          for: 2m
          labels: {severity: critical, course: bookinfo}
          annotations:
            summary: No productpage replicas available
