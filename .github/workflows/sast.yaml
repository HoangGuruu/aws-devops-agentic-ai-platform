name: CodeQL SAST
on:
  push:
    branches: [waiting]
    # branches: [main]
    paths: ['agent/**', 'bookinfo/src/**', 'scripts/**']
  pull_request:
    paths: ['agent/**', 'bookinfo/src/**', 'scripts/**']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix: {language: [python, javascript-typescript]}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: '${{ matrix.language }}', build-mode: none}
      - uses: github/codeql-action/analyze@v3
