name: Validate course
on:
  push:
    paths-ignore: ['legacy/**', 'images/**', '**.md']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - uses: azure/setup-kubectl@v4
        with: {version: 'v1.35.0'}
      - run: |
          for env in develop uat staging prod; do
            kubectl kustomize gitops/overlays/$env > /tmp/$env.yaml
          done
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.3'}
      - run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/main infra/knowledge-base; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          skip-dirs: legacy
          severity: CRITICAL
          exit-code: '1'
