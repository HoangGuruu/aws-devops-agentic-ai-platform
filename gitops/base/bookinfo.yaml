apiVersion: v1
kind: Service
metadata:
  name: productpage
  labels:
    app: productpage
    service: productpage
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: productpage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-productpage
  labels:
    account: productpage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  labels:
    app: productpage
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9080'
        prometheus.io/path: /metrics
      labels:
        app: productpage
        version: v1
    spec:
      serviceAccountName: bookinfo-productpage
      containers:
      - name: productpage
        image: course/productpage:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 9080
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: LAB_FAULT_MODE
          value: 'off'
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: productpage-session
              key: secret
      volumes:
      - name: tmp
        emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
  progressDeadlineSeconds: 180
---
